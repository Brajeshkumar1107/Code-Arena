spring:
  datasource:
    url: jdbc:h2:mem:codearena;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  flyway:
    enabled: false

  kafka:
    bootstrap-servers: localhost:9092

runner:
  security:
    enabled: false

  rate-limit:
    enabled: false
