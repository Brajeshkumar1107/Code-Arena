name: CodeArena CI/CD

on:
  push:
    branches:
      - master

jobs:
  ci:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        # GitHub exports RUNNER_ENVIRONMENT=github-hosted. Spring relaxed
        # binding maps that onto runner.environment, which is the
        # ExecutionEnvironmentType enum, so context binding fails with
        # "No enum constant ...github-hosted". Unset it for this step.
        env:
          CODEARENA_RUNNER_ENVIRONMENT: DOCKER
        run: env -u RUNNER_ENVIRONMENT mvn -B clean verify

  deploy:
    name: Deploy to Oracle VM
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Oracle VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ~/Code-Arena
            git pull origin master
            docker compose -f docker-compose.aws.yml up -d --build runner

            for attempt in $(seq 1 60); do
              if curl -fsS http://127.0.0.1:8081/actuator/health; then
                echo "Runner is healthy."
                exit 0
              fi
              echo "Waiting for runner to become healthy (attempt ${attempt}/60)..."
              sleep 5
            done

            echo "Runner did not become healthy. Container status:"
            docker compose -f docker-compose.aws.yml ps
            echo "Recent runner logs:"
            docker compose -f docker-compose.aws.yml logs --tail=200 runner
            exit 1
